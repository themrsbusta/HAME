HAME:
  name: Hierarchical Async Memory Engine
  acronym: HAME
  version: 1.3.0 (Agentic Context Compilation Revision)
  author: Busta Supastar

  objective:
    - Eliminate lost-in-the-middle phenomena and attention degradation in long sessions.
    - Provide virtually unlimited context lineage using zero-waste prompt compilation.
    - Guarantee high reasoning performance without requiring architectural transformer modifications.
    - Adapt seamlessly between constrained hardware (mobile/edge) and dedicated GPUs.

  philosophy:
    principle:
      - Intelligence computes; static text clutters.
      - Attention is a scarce resource; working memory must remain dense and pure.
      - Context should be compiled by an agent, not appended raw.
      - Structured state contracts enable seamless inter-process handshakes.

    inspiration:
      - Operating System Process Swapping & IPC Mechanisms
      - CPU L1/L2 Cache Invalidation & Reload
      - Human Episodic Memory Reconsolidation

  architecture:

    protocol_format: Structured Inter-Process State (Implementation-agnostic: YAML, JSON, MsgPack, etc.)

    main_worker:
      alias: Primary Reasoner
      target_model: Larger reasoning LLM (e.g., 8B-70B class)
      role:
        - Handle direct user interaction.
        - Execute complex logical reasoning.
        - Detect context saturation or context retrieval triggers.
        - Output structured state dump (`context_state`).

    compiler_worker:
      alias: Context Compiler / Small LLM Worker
      target_model: Fast, lightweight LLM (e.g., 1B-3B class)
      role:
        - Read `context_state` intent and execution goals.
        - Query persistent long-term storage (files, text archives, databases).
        - Filter noise, resolve ambiguities, and synthesize pertinent facts.
        - Output clean, structured input (`compiled_prompt`).

    orchestrator:
      type: Runtime Process Manager
      role:
        - Manage lifecycle, PIDs, and execution modes of LLM engines (e.g., `llama.cpp` / `llama-server`).
        - Coordinate state handshakes via file system, IPC, or RAM Disk (`/dev/shm`).
        - Provide stateless API interface to client (transparent pipeline).

  data_contracts:

    context_state_schema:
      description: Generated by Main Worker when context boundary is reached or retrieval is needed.
      structure:
        session_id: string
        current_goal: string
        unresolved_question: string
        last_summary: string
        search_intent: string

    compiled_prompt_schema:
      description: Generated by Compiler Worker and injected into Main Worker.
      structure:
        system_instruction: string
        context_bundle:
          retrieved_knowledge:
            - source: string
              fact: string
          conversation_lineage:
            - string
        response_format: string

  execution_modes:

    constrained_mode:
      target_hardware: Mobile devices, single SBCs, low RAM/VRAM systems.
      strategy: Process Swapping (Kill / Spawn)
      pipeline:
        step_1: Main Worker detects context saturation and writes `context_state`.
        step_2: Orchestrator terminates Main Worker process (`SIGTERM`/`SIGKILL`) to free RAM.
        step_3: Orchestrator spawns Compiler Worker.
        step_4: Compiler Worker reads `context_state`, retrieves data, writes `compiled_prompt`, and exits.
        step_5: Orchestrator spawns Main Worker pre-loaded with `compiled_prompt`.
      latency_tradeoff: Small I/O model reload overhead in exchange for zero VRAM overflow.

    resident_mode:
      target_hardware: Workstations, dedicated high-VRAM GPUs.
      strategy: Dual Resident Workers + IPC / RAM Disk (`/dev/shm`)
      pipeline:
        step_1: Both Main and Compiler models remain resident in VRAM simultaneously.
        step_2: Main Worker streams `context_state` into RAM Disk / Shared Memory.
        step_3: Compiler Worker picks up payload, compiles retrieval, and writes `compiled_prompt`.
        step_4: Orchestrator resets Main Worker context slot and injects `compiled_prompt`.
      latency_tradeoff: Near-zero latencies (~100-200ms total pipeline overhead).

  comparison:

    hame_1_0_legacy:
      retrieval: BM25 / Lexical Search
      context_management: Append raw retrieved text chunks
      vram_footprint: Static context windows, risk of raw chunk clutter

    hame_1_3_agentic:
      retrieval: Agentic compilation via Small LLM Worker
      context_management: Full Working Memory reset via compiled prompt contract
      vram_footprint: Optimized / Dynamic (Supports 100% VRAM swap or dual resident)

  summary:
    HAME 1.3 replaces static retrieval algorithms with an LLM-driven Context Compiler.
    By standardizing working memory state in clean, structured contracts, the architecture isolates 
    reasoning from retrieval while maintaining complete transparency for the end user.